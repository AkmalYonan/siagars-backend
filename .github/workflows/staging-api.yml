name: staging-api

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-api
  cancel-in-progress: false

jobs:
  api:
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (github.event.deployment.ref == 'develop' || github.event.deployment.ref == 'refs/heads/develop') &&
       !github.event.deployment.production_environment &&
       github.event.deployment.environment == (vars.STAGING_DEPLOYMENT_ENVIRONMENT || 'Preview')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: qa
    env:
      SIAGARS_BASE_URL: ${{ vars.SIAGARS_STAGING_URL }}
      SIAGARS_PUBLIC_ORIGIN: ${{ vars.SIAGARS_STAGING_PUBLIC_ORIGIN }}
      OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
      OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_ALLOW_MUTATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Verify staging readiness and API version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const target = new URL(process.env.SIAGARS_BASE_URL);
          if (target.protocol !== 'https:' || target.hostname === 'siagars-backend.vercel.app') {
            throw new Error('SIAGARS_STAGING_URL must name the HTTPS staging environment.');
          }
          const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const headers = bypass ? { 'x-vercel-protection-bypass': bypass } : {};
          async function get(path) {
            const response = await fetch(new URL(path, target), {
              headers, redirect: 'error', signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return response.json();
          }
          await get('/api/v1/ready');
          const expected = JSON.parse(readFileSync('../backend/docs/openapi.yaml', 'utf8')).info.version;
          const live = await get('/docs/openapi.json');
          if (live.info?.version !== expected) throw new Error(`Expected staging API ${expected}`);
          JS
      - run: npm test
