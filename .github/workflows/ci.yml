# BE-04: gofmt, vet, unit + contract tests and the race detector on every PR and push to develop/main.
# Integration uses a disposable MongoDB replica set on the runner.
name: backend-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "File belum di-gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name siagars-mongo --publish 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec siagars-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -qx 1; then
              break
            fi
            sleep 1
          done
          docker exec siagars-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec siagars-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -qx true; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::MongoDB replica set did not elect a primary."
          exit 1
      - name: MongoDB integration
        run: go test -count=1 ./tests/integration/...
