# Example same-origin reverse proxy (nginx), place in conf.d/siagars.conf.
# Replace siagars.example.com and certificate paths. Not deployed or tested in this repository.
# PUBLIC_ORIGIN for the Go API must equal https://siagars.example.com exactly.

# Rate-limit layer in front of the app-level limiter (optional).
limit_req_zone $binary_remote_addr zone=siagars_api:10m rate=20r/s;

upstream siagars_api { server 127.0.0.1:8080; keepalive 16; }
upstream siagars_web { server 127.0.0.1:3000; keepalive 16; }

server {
	listen 80;
	server_name siagars.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name siagars.example.com;

	ssl_certificate     /etc/letsencrypt/live/siagars.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/siagars.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	server_tokens off;
	client_max_body_size 1m;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

	# API only. /docs and /docs/openapi.json on the Go port are intentionally not proxied.
	location /api/v1/ {
		limit_req zone=siagars_api burst=40 nodelay;
		proxy_pass http://siagars_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		# Overwrite (never append to) client-supplied XFF so it cannot be spoofed.
		# The Go API only honors it from addresses listed in TRUSTED_PROXIES.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 15s;
	}

	location / {
		proxy_pass http://siagars_web;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
