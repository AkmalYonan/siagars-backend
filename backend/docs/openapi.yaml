    "/hospitals": {
      "get": {
        "summary": "Cari RS pilot: layanan AND, unknown berbeda dari false/0",
        "operationId": "get_hospitals",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100
            },
            "description": "Nama RS, kota atau provinsi, case-insensitive"
          },
          {
            "name": "province_code",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Kode master provinsi lokal"
          },
          {
            "name": "city_code",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Kode master kota lokal"
          },
          {
            "name": "services",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Comma-separated slug layanan, AND; status available/limited. Hanya RS yang datanya memuat layanan tersebut yang cocok; RS dari SATUSEHAT MSI belum memiliki data layanan."
          },
          {
            "name": "bpjs",
            "in": "query",
            "schema": {
              "type": "boolean"
            },
            "description": "Hanya known true/false"
          },
          {
            "name": "has_available_beds",
            "in": "query",
            "schema": {
              "type": "boolean"
            },
            "description": "true: available>0, fresh, non-simulation; false: tidak memfilter"
          },
          {
            "name": "lat",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": -90,
              "maximum": 90
            },
            "description": "Harus berpasangan lng"
          },
          {
            "name": "lng",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": -180,
              "maximum": 180
            },
            "description": "Harus berpasangan lat"
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "name",
                "distance",
                "match"
              ],
              "default": "name"
            },
            "description": "distance butuh lat/lng; null distance terakhir. match: layanan non-simulation available +10/limited +5, fresh +3/aging +1, lalu jarak, nama, ID. Bukan skor klinis."
          },
          {
            "name": "dataset",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "real",
                "simulation",
                "all"
              ],
              "default": "real"
            },
            "description": "Pemisah data. real (default) = semua data selain simulasi (curated, satusehat_sandbox, satusehat_production); simulation = hanya 30 RS fiktif demo; all = keduanya. Tetap periksa data_origin pada setiap item: satusehat_sandbox adalah data Sandbox, belum produksi."
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
