    "/hospitals": {
      "get": {
        "summary": "Cari RS pilot: layanan AND, unknown berbeda dari false/0",
        "operationId": "get_hospitals",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100
            },
            "description": "Nama RS, kota atau provinsi, case-insensitive"
          },
          {
            "name": "province_code",
            "in": "query",
            "schema": {
              "type": "string"
