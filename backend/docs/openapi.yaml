{
  "openapi": "3.0.3",
  "info": {
    "title": "SiagaRS Backend",
    "version": "0.2.1",
    "description": "API pencarian rumah sakit, provenance data, tracking rujukan **sintetis**, dan operasi operator. Seluruh data pada V0.1 adalah data demo/simulasi atau sandbox: tidak ada data pasien nyata.\n\n## Versi 0.2.1 (25 Okt 2026): data contoh fasilitas untuk RS nyata\n- RS nyata (SATUSEHAT) di staging kini punya **data contoh** ICU/NICU/PICU/IGD/ambulans/rawat inap, bed, dan BPJS agar UI bisa dibangun. Semuanya **simulasi, bukan fakta RS**: item berlabel `data_origin: \"simulation\"`, tanpa `source_url`, tidak pernah `verified_at`. `data_origin` RS tetap `satusehat_sandbox`.\n- Field baru: `bpjs_data_origin` (pada Hospital) dan `facility_summary.data_origin`. Keduanya aditif. FE **wajib** memberi label \"Simulasi\" bila nilainya `simulation`.\n- Data kurasi bersumber nanti menggantikan data contoh tanpa mengubah bentuk respons.\n\n## Versi 0.2.0 (25 Okt 2026): apa yang berubah\n- **Baru:** `GET /regions`, `GET /hospitals/suggest`, `GET /admin/hospitals`, `GET /admin/hospitals/{id}` (total 19 operasi).\n- **Hospital** punya field baru: `external_id`, `source_namespace`, `facility_class`, `facility_subtype`, `operational`, `bpjs_source_url`, `bpjs_source_updated_at`, `facility_summary`. Semua aditif; field lama tidak berubah.\n- **Compare/detail** menerima UUID **atau** kode SATUSEHAT (`external_id`).\n- **Layanan baru** `rawat-inap` (bed rawat inap = kategori `general`).\n- **Data RS nyata** (SATUSEHAT) belum punya ICU/NICU/PICU/bed/BPJS: nilainya `unknown`/`null`, bukan 0/false.\n- Rincian lengkap dan catatan migrasi FE: `docs/CHANGELOG.md`.\n\n## Mulai cepat\n- **Publik** (tanpa login): `GET /health`, `GET /services`, `GET /hospitals`, `GET /hospitals/{id}`, `GET /hospitals/compare`, `POST /referrals/lookup`.\n- **Operator**: `POST /auth/login` -> cookie sesi `siagars_session` (HttpOnly) -> `GET /auth/csrf` -> kirim header `X-CSRF-Token` + `Origin` pada setiap mutasi (`POST`/`PATCH`).\n- Prefix `/api/v1`, JSON snake_case, UUID lowercase, waktu RFC3339 UTC. Tombol **Test Request** memakai server yang sedang menyajikan halaman ini.\n\n## Aturan teknis\nBaseline 23 Oktober 2026. Semua path relatif /api/v1. UUID lowercase, RFC3339 UTC, JSON snake_case. Parameter query hospitals yang tidak dikenal, kosong atau berulang menghasilkan 422. Service filter AND status available/limited. Body unknown field menghasilkan 400. Body 64 KB. Layanan/bed mempertahankan provenance field-level; freshness dihitung dari source_updated_at: <1 jam fresh, 1..24 jam aging, >24 jam stale, null/future unknown. Simulasi tidak membuktikan layanan nyata. Semua response no-store. Login: 5 gagal/15 menit/IP+akun, ceiling 100 request/15 menit/IP; lookup 10/menit/IP. X-Forwarded-For hanya dipercaya untuk rate limit bila peer langsung termasuk proxy terdaftar (env TRUSTED_PROXIES, default kosong = tidak dipercaya). Parameter q mencocokkan substring tanpa pembedaan huruf pada \"nama kota provinsi\" (pelipatan huruf hanya untuk ASCII); filter, urutan nama dan paginasi dijalankan di database tanpa mengubah hasil. State machine submitted->verified->searching->confirmed->completed; verified/searching->rejected; confirmed->searching perlu alasan. Terminal completed/rejected. Data SATUSEHAT MSI Sandbox bersifat opsional (diimpor manual oleh backend, bukan proxy): data_origin satusehat_sandbox, source_updated_at/verified_at null sehingga freshness unknown, bpjs null, services/beds array kosong; fasilitas yang eksplisit nonaktif di sumber tidak ditampilkan. List saat ini memberi DTO Hospital lengkap; map memakai halaman yang sama. Daftar /hospitals memakai dataset=real secara default sehingga data simulasi tidak bercampur; detail RS dan lookup rujukan demo tetap dapat memuat RS simulasi."
  },
